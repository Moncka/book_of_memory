<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Книга пам'яті</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #111; 
            overflow: hidden; 
        }
        
        #viewport {
            width: 100%; 
            height: 100%;
            display: flex; 
            justify-content: center; 
            align-items: center;
            position: relative;
        }

        #flipbook-container {
            position: relative;
            width: 100%; 
            height: 100%;
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        .nav-btn {
            position: absolute; 
            top: 0; 
            height: 100%; 
            width: 10%;
            background: transparent; 
            border: none;
            color: rgba(255, 255, 255, 0.2); 
            font-size: 2.5rem;
            cursor: pointer; 
            z-index: 1000; 
            transition: 0.3s;
            display: flex; 
            align-items: center; 
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        
        @media (max-width: 768px) {
            .nav-btn { width: 12%; font-size: 1.8rem; color: rgba(255, 255, 255, 0.4); }
        }
        
        .nav-btn:hover { color: gold; }
        #prev-btn { left: 0; }
        #next-btn { right: 0; }

        #flipbook {
            margin: 0 auto;
        }

        .single-spread { 
            background-color: #111; 
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center;
            width: 100%; 
            height: 100%;
        }

        .turn-page-shadow { display: none !important; }
    </style>
</head>
<body>

<div id="viewport">
    <button class="nav-btn" id="prev-btn">❮</button>
    <div id="flipbook-container">
        <div id="flipbook"></div>
    </div>
    <button class="nav-btn" id="next-btn">❯</button>
</div>

<script>
    const imageUrls = [
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F1.webp?alt=media&token=425f8291-0538-454c-8801-bd23c60e84da",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F2.webp?alt=media&token=c04035ba-85ef-4d2b-a785-5863851cdfa7",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F3.webp?alt=media&token=179e0c59-218d-4f3d-80a8-0a85da33c507",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F4.webp?alt=media&token=6eca7d34-b2d2-4223-a308-70f1561ac6ca",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F5.webp?alt=media&token=97e19082-edb4-43cd-ac1c-438509e56cb7",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F6.webp?alt=media&token=c0c99bd3-2ecb-4a36-91b9-3afda2cf9a60",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F7.webp?alt=media&token=3fc3b38c-7f1e-49de-b001-4246134ba3c7",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F8.webp?alt=media&token=4773aced-10ba-4bfb-8aab-c11b1f84b8aa",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F9.webp?alt=media&token=6438db44-ad4e-415a-abb3-b6864c8ec9d1",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F10.webp?alt=media&token=87657dce-9bff-42c6-851e-ca3773dec795",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F11.webp?alt=media&token=f553f752-d9eb-475d-ab9b-5833eac4f2d0",
       "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/new%2F12.webp?alt=media&token=6566de33-522c-4d57-be11-7df9a1b096cd"
    ];

    const book = $("#flipbook");

    function getBookSize() {
        const windowWidth = $(window).width();
        const windowHeight = $(window).height();
        
        let containerWidth = windowWidth < 768 ? windowWidth : windowWidth * 0.96;
        let containerHeight = windowHeight;
        
        if (containerWidth <= 0) containerWidth = 800;
        if (containerHeight <= 0) containerHeight = 450;
        
        let width = containerWidth;
        let height = width * (1080 / 1920);

        if (height > containerHeight) {
            height = containerHeight;
            width = height * (1920 / 1080);
        }

        return { width: Math.round(width), height: Math.round(height) };
    }

    function resizeBook() {
        if (book.turn("is")) {
            const size = getBookSize();
            book.turn("size", size.width, size.height);
        }
    }

    $(document).ready(function() {
        // 1. Створюємо контейнери (використовуємо custom-page для безпеки)
        imageUrls.forEach((url, index) => {
            const spread = $(`<div class="single-spread" id="custom-page-${index}"></div>`);
            
            // Завантажуємо фон тільки для першої сторінки
            if (index === 0) {
                spread.css('background-image', `url(${url})`);
            }
            book.append(spread);
        });

        const initialSize = getBookSize();

        book.turn({
            width: initialSize.width,
            height: initialSize.height,
            display: 'single', 
            autoCenter: true,
            acceleration: true,
            gradients: true,
            elevation: 50
        });

        $("#prev-btn").click(() => book.turn("previous"));
        $("#next-btn").click(() => book.turn("next"));
        
        $(document).keydown(function(e) {
            if (e.keyCode == 37) book.turn("previous");
            else if (e.keyCode == 39) book.turn("next");
        });

        // 2. Відкладене послідовне завантаження інших сторінок
        async function loadImagesSequentially() {
            for (let i = 1; i < imageUrls.length; i++) {
                await new Promise((resolve) => {
                    const img = new Image();
                    img.src = imageUrls[i];
                    img.onload = () => {
                        $(`#custom-page-${i}`).css('background-image', `url(${imageUrls[i]})`);
                        resolve(); 
                    };
                    img.onerror = () => {
                        console.error(`Помилка завантаження зображення ${i}`);
                        resolve(); 
                    };
                });
            }
        }
        
        loadImagesSequentially();

        // 3. НОВИЙ СПОСІБ РЕСАЙЗУ (замість window.onload)
        // ResizeObserver безперервно і точно слідкує за розміром екрану/iframe
        const viewportElement = document.getElementById('viewport');
        if (viewportElement) {
            const resizeObserver = new ResizeObserver(() => {
                // Використовуємо requestAnimationFrame для плавності
                requestAnimationFrame(() => {
                    resizeBook();
                });
            });
            resizeObserver.observe(viewportElement);
        }

        // Залишаємо стандартний resize як резервний
        $(window).resize(resizeBook);
    });
</script>

</body>
</html>
