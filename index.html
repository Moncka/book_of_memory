<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Книга пам'яті</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: #111; 
            overflow: hidden; 
        }
        
        #viewport {
            width: 100%; 
            height: 100%;
            display: flex; 
            justify-content: center; 
            align-items: center;
            position: relative;
        }

        #flipbook-container {
            position: relative;
            width: 100%; 
            height: 100%;
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        .nav-btn {
            position: absolute; 
            top: 0; 
            height: 100%; 
            width: 10%;
            background: transparent; 
            border: none;
            color: rgba(255, 255, 255, 0.2); 
            font-size: 2.5rem;
            cursor: pointer; 
            z-index: 1000; 
            transition: 0.3s;
            display: flex; 
            align-items: center; 
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        
        @media (max-width: 768px) {
            .nav-btn { width: 12%; font-size: 1.8rem; color: rgba(255, 255, 255, 0.4); }
        }
        
        .nav-btn:hover { color: gold; }
        #prev-btn { left: 0; }
        #next-btn { right: 0; }

        #flipbook {
            margin: 0 auto;
        }

        .single-spread { 
            background-color: #111; 
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center;
            width: 100%; 
            height: 100%;
        }

        .turn-page-shadow { display: none !important; }
    </style>
</head>
<body>

<div id="viewport">
    <button class="nav-btn" id="prev-btn">❮</button>
    <div id="flipbook-container">
        <div id="flipbook"></div>
    </div>
    <button class="nav-btn" id="next-btn">❯</button>
</div>

<script>
    const imageUrls = [
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/1.png?alt=media&token=0f6a710f-03a7-4b9a-8a33-57eb53f3d41d",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/2.png?alt=media&token=d74e1186-1260-440c-9303-22ee6aeed919",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/3.png?alt=media&token=6b8961a3-2bc3-488f-a710-b9bec135af7e",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/4.png?alt=media&token=b0759699-e82c-4c80-91e6-578286cc62dc",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/5.png?alt=media&token=dc2137d0-1484-4f9f-9ed3-e586a1f0d175",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/6.png?alt=media&token=a6895390-aee1-436e-8cbe-4411d7a66fb5",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/7.png?alt=media&token=8829e900-61da-4fc9-946e-1772b434c421",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/8.png?alt=media&token=d96fc491-a5c2-47c3-b75c-c26c5c2c701a",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/9.png?alt=media&token=35200d79-62f4-4b83-b491-fd3ba6e055f3",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/10.png?alt=media&token=bee79d46-3a01-4ff9-94de-86062e5cbfec",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/11.png?alt=media&token=dbb27aa7-3de7-4adc-8d71-35f7100d11c0",
        "https://firebasestorage.googleapis.com/v0/b/discord-py-ems-db.firebasestorage.app/o/12.png?alt=media&token=1181b184-6e3f-402c-b78a-b09abab3a900"
    ];

    const book = $("#flipbook");

    function getBookSize() {
        const windowWidth = $(window).width();
        const windowHeight = $(window).height();
        
        let containerWidth = windowWidth < 768 ? windowWidth : windowWidth * 0.96;
        let containerHeight = windowHeight;
        
        if (containerWidth <= 0) containerWidth = 800;
        if (containerHeight <= 0) containerHeight = 450;
        
        let width = containerWidth;
        let height = width * (1080 / 1920);

        if (height > containerHeight) {
            height = containerHeight;
            width = height * (1920 / 1080);
        }

        return { width: Math.round(width), height: Math.round(height) };
    }

    function resizeBook() {
        if (book.turn("is")) {
            const size = getBookSize();
            book.turn("size", size.width, size.height);
        }
    }

    $(document).ready(function() {
        // 1. Створюємо контейнери для сторінок
        imageUrls.forEach((url, index) => {
            const spread = $(`<div class="single-spread" id="page-${index}"></div>`);
            
            // Встановлюємо фон ТІЛЬКИ для першої сторінки відразу
            if (index === 0) {
                spread.css('background-image', `url(${url})`);
            }
            book.append(spread);
        });

        const initialSize = getBookSize();

        book.turn({
            width: initialSize.width,
            height: initialSize.height,
            display: 'single', 
            autoCenter: true,
            acceleration: true,
            gradients: true,
            elevation: 50
        });

        $("#prev-btn").click(() => book.turn("previous"));
        $("#next-btn").click(() => book.turn("next"));
        
        $(document).keydown(function(e) {
            if (e.keyCode == 37) book.turn("previous");
            else if (e.keyCode == 39) book.turn("next");
        });

        // 2. Асинхронна функція для послідовного завантаження
        async function loadImagesSequentially() {
            // Починаємо з індексу 1, бо 0 (перша сторінка) вже завантажується
            for (let i = 1; i < imageUrls.length; i++) {
                await new Promise((resolve) => {
                    const img = new Image();
                    img.src = imageUrls[i];
                    
                    // Коли картинка повністю завантажилась у фоні
                    img.onload = () => {
                        $(`#page-${i}`).css('background-image', `url(${imageUrls[i]})`);
                        resolve(); // Переходимо до наступної ітерації циклу
                    };
                    
                    // Якщо сталася помилка завантаження (щоб черга не зупинилась назавжди)
                    img.onerror = () => {
                        console.error(`Помилка завантаження зображення ${i}`);
                        resolve(); 
                    };
                });
            }
        }

        // Запускаємо процес фонового завантаження
        loadImagesSequentially();
        
        $(window).on('load', function() {
            setTimeout(resizeBook, 150);
        });
    });

    $(window).resize(resizeBook);
</script>

</body>
</html>
